# irlingo on an ESP32 with ESPHome: an air conditioner and an amplifier.
#
# Wiring: an IR LED circuit on GPIO4, see doc/hardware.md.
# Flash it over USB:
#   esphome run esphome-irlingo.yaml --device /dev/ttyUSB0

esphome:
  name: irlingo-example

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source: github://mortenmathiasen/irlingo@v3.1.0
    components: [irlingo]

remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true

irlingo:
  # A remote from the repository's conf/remotes, by name
  - id: aircon
    remote: panasonic/hvac_panasonic
  # Its file name alone is enough when it is unique
  - id: amp
    remote: RC4330_01H_Philips_RC433001H_AMP
  # Or your own remote file, next to this YAML file:
  # - id: tv
  #   file: my-remotes/livingroom-tv.json

climate:
  # The air conditioner as a thermostat in Home Assistant; the modes,
  # temperature and fan speed are guessed from the remote's features
  - platform: irlingo
    remote_id: aircon
    name: Living room air conditioner
    fixed: {option: AUTO, updown: AUTO, leftright: AUTO}

button:
  - platform: irlingo
    remote_id: amp
    name: Amplifier power
    features:
      key: Power

binary_sensor:
  # The board's BOOT button sends the amplifier's power key
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true # the button is meant to be on GPIO0
    name: Boot button
    on_press:
      - irlingo.send:
          remote_id: amp
          features:
            key: Power
