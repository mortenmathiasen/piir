# Philips RC6 mode 0 with its double length trailer bit
begin remote
  name  TEST-RC6
  bits           16
  flags RC6|CONST_LENGTH
  header       2666   889
  one           444   444
  zero          444   444
  pre_data_bits   5
  pre_data       0x1F
  gap          106000
  toggle_bit_mask 0x10000
  rc6_mask       0x100000

      begin codes
          KEY_POWER                0xEFF3
          KEY_PLAY                 0xEFD3
      end codes
end remote
