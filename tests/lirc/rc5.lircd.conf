# Philips RC5: bi-phase bits and a toggle bit
begin remote
  name  TEST-RC5
  bits           13
  flags RC5|CONST_LENGTH
  one           889   889
  zero          889   889
  plead         889
  gap          113792
  min_repeat      1
  toggle_bit_mask 0x800

      begin codes
          KEY_POWER                0x100C
          KEY_1                    0x1001
          KEY_VOLUMEUP             0x1010
      end codes
end remote
