# NEC style remote: header, trailing pulse, repeat code, pre_data, a toggle
# bit, min_repeat, a constant frame length and a key sending two codes.
begin remote
  name  TEST-NEC
  bits           16
  flags SPACE_ENC|CONST_LENGTH
  eps            30
  aeps          100
  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat       9000  2250
  pre_data_bits   16
  pre_data       0x20DF
  gap          108000
  min_repeat      1
  toggle_bit_mask 0x8000

      begin codes
          KEY_POWER                0x10EF
          KEY_MUTE                 0x906F
          KEY_1                    0x8877
          MACRO                    0x10EF 0x906F
      end codes
end remote
