# Sony SIRC style remote, bits sent LSB first, repeated three times
begin remote
  name  TEST-SONY
  bits           12
  flags SPACE_ENC|CONST_LENGTH|REVERSE
  header       2400   600
  one          1200   600
  zero          600   600
  gap          45000
  min_repeat      2

      begin codes
          KEY_POWER                0xA90
          KEY_VOLUMEUP             0x490
          KEY_VOLUMEDOWN           0xC90
      end codes
end remote
